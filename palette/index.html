<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThumbSorter</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1b; --sub:#6b6a66; --line:#e3e1dc;
  --accent:#c2410c; --moved:#1d4ed8; --drop:#b91c1c; --warn:#b45309; --chip:#f0eee9; --sel:#2563eb; --ok:#15803d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161614; --panel:#201f1d; --ink:#ecebe7; --sub:#a3a19b; --line:#34322f;
    --accent:#fb923c; --moved:#60a5fa; --drop:#f87171; --warn:#fbbf24; --chip:#2b2a27; --sel:#60a5fa; --ok:#4ade80;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,"Yu Gothic UI","Hiragino Sans","Microsoft YaHei","PingFang SC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
h1{font-size:15px;margin:0 6px 0 0}
.stat{color:var(--sub)} .stat b{color:var(--ink)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button,.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button.dl{margin-left:10px;border:1px solid var(--ok);color:var(--ok);background:transparent;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.tabs button.dl svg{width:14px;height:14px}
.tabs button.dl.on{background:var(--ok);border-color:var(--ok);color:#fff}
.box.dl{border:2px solid var(--ok)}
.box.dl h2{color:var(--ok);display:flex;align-items:center;gap:6px}
.box.dl h2 svg{width:18px;height:18px}
.btn.go-dl{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--drop);border-color:var(--drop);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:2px 8px;font-size:12px}
select,input[type=search],input[type=text]{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 8px;font:inherit}
.spacer{flex:1}
#prog{display:none;align-items:center;gap:8px;width:100%}
#prog .bar{flex:1;height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
#prog .bar i{display:block;height:100%;background:var(--accent);width:0}
main{display:flex;min-height:calc(100vh - 50px)}
nav{width:250px;flex:none;border-right:1px solid var(--line);padding:8px 6px;overflow:auto;max-height:calc(100vh - 50px);position:sticky;top:50px}
nav .f{display:flex;justify-content:space-between;padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;border:2px solid transparent}
nav .f:hover{background:var(--chip)} nav .f.on{background:var(--accent);color:#fff}
nav .f.over{border-color:var(--sel);background:var(--chip);color:var(--ink)}
nav .f .n{color:var(--sub);font-variant-numeric:tabular-nums} nav .f.on .n{color:#fff}
nav .newf{display:flex;gap:4px;margin:8px 0}
nav .newf input{flex:1;min-width:0}
#content{flex:1;padding:12px 14px;min-width:0}
.hint{color:var(--sub);margin:0 0 10px}
.selbar{display:flex;gap:8px;align-items:center;margin:0 0 10px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:grab;user-select:none}
.card.sel{border-color:var(--sel)}
.card.moved{box-shadow:inset 4px 0 0 var(--moved)}
.card.del{opacity:.55}
.thumb{background:#fff;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.thumb .noimg{color:#9a9890;font-size:12px}
a.link{color:var(--moved);cursor:pointer;text-decoration:underline}
a.brand{cursor:pointer;display:flex;align-items:center}
a.brand img{height:36px;width:auto;display:block}
footer{border-top:1px solid var(--line);padding:8px 14px;color:var(--sub);font-size:11px;background:var(--panel)}
.group .tag.k{color:var(--ok)}
#ghost{position:fixed;z-index:20;pointer-events:none;background:var(--sel);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
body.dragging,body.dragging *{cursor:grabbing !important;user-select:none}
body.picking nav .f[data-drop]{outline:1px dashed var(--sel)}
.body{padding:6px 8px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.name{font-weight:600;font-size:13px;word-break:break-all}
.meta{color:var(--sub)}
.dest b{color:var(--moved)}
.why{color:var(--sub);font-size:11.5px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--chip);color:var(--sub)}
.act{border:1px solid var(--line);border-radius:5px;padding:1px 8px;cursor:pointer;background:var(--chip);color:var(--ink);font:inherit;font-size:12px}
.act.del{color:var(--drop);border-color:var(--drop)}
.group{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.group h3{margin:0 0 8px;font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;max-width:900px}
.box h2{font-size:14px;margin:0 0 8px}
.box label{display:flex;gap:6px;align-items:center;margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.msg{white-space:pre-wrap;color:var(--sub)}
#pending{display:none;position:absolute;top:6px;right:10px;z-index:6;color:var(--warn);font-weight:600;cursor:pointer;border:1px solid var(--warn);border-radius:6px;padding:2px 8px;background:transparent;font-size:12px}
#pending.on{display:inline-block}
header.haspend{padding-right:360px}
#lang{padding:2px 4px;font-size:12px}
.msg.err{color:var(--drop)} .msg.ok{color:var(--ok)}
.empty{color:var(--sub);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>ThumbSorter</h1>
  <select id="hub"></select>
  <button class="btn" id="reload"></button>
  <span class="stat" id="scanned"></span>
  <span class="stat" id="stat"></span>
  <div class="tabs" id="tabs"></div>
  <input type="search" id="q" style="width:150px">
  <span class="spacer"></span>
  <span class="stat" id="autosave"></span>
  <select id="lang" title="Language / 言語 / 语言">
    <option value="auto">Auto</option><option value="ja">日本語</option><option value="en">English</option><option value="zh">中文</option>
  </select>
  <a class="link" data-url="manual" id="manual"></a>
  <a class="brand" data-url="site" id="brand"><picture><source srcset="../resources/sin1studio_logo_white.png" media="(prefers-color-scheme: dark)"><img src="../resources/sin1studio_logo.png" alt="sin1's studio"></picture></a>
  <button id="pending"></button>
  <div id="prog"><span id="progtxt"></span><div class="bar"><i id="progbar"></i></div></div>
</header>
<main>
  <nav id="nav"></nav>
  <section id="content"><div class="empty" id="starting"></div></section>
</main>
<footer id="footer"></footer>
<div id="ghost"></div>

// 自動判定の予備（Fusion から言語が届くまで／取れないとき）
const browserLang = () => { const l = (navigator.language || '').toLowerCase(); return l.startsWith('ja') ? 'ja' : l.startsWith('zh') ? 'zh' : 'en'; };

// ---------- Fusion との通信 ----------
function call(action, data) {
  return new Promise((resolve, reject) => {
    if (!window.adsk || !adsk.fusionSendData) return reject(new Error(L.notInFusion));
    Promise.resolve(adsk.fusionSendData(action, JSON.stringify(data || {}))).then(r => {
      let o; try { o = JSON.parse(r); } catch (e) { return reject(new Error(String(r))); }
      o.ok ? resolve(o.result) : reject(new Error(o.error));
    }, reject);
  });
}
window.fusionJavaScriptHandler = {
  handle(action, data) {
    if (action === 'progress') {
      const p = JSON.parse(data);
      const box = document.getElementById('prog');
      box.style.display = 'flex';
      document.getElementById('progtxt').textContent = `${L.phase[p.phase] || p.phase} ${p.done}${p.total ? ' / ' + p.total : ''}`;
      document.getElementById('progbar').style.width = p.total ? (100 * p.done / p.total) + '%' : '30%';
    }
    return 'OK';
  }
};
const busy = on => {
  document.querySelectorAll('header .btn, #content .btn').forEach(b => { b.disabled = on; });
  if (!on) document.getElementById('prog').style.display = 'none';
};

// ---------- 状態 ----------
let lastPending = -1;     // Python 側へ知らせた未反映の件数（閉じたときの警告用）
let S = null;               // 読み込み結果 {hubId, workDir, items, folders, plan}
let tab = 'tree', folder = null;
const sel = new Set();
const TABS = ['tree', 'dup', 'sim', 'src', 'run', 'dl'];
const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m6 10 6 6 6-6"/><path d="M4 20h16"/></svg>';
// 外部リンク（Python 側で sin1.studio と GitHub のこのリポジトリ以外は開かない）。解説記事は日本語なので、他の言語は README の英語版へ
const LINKS = { site: 'https://sin1.studio/', manual: 'https://sin1.studio/blog/thumbsorter/', manualEn: 'https://github.com/sin1n24/FusionSorter#english' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fileUrl = p => { const [d, ...r] = p.split('/'); return 'file:///' + d + '/' + r.map(encodeURIComponent).join('/'); };
const dest = it => S.plan.dest[it.id] ?? it.init;
// 理由は旧版では日本語の文字列、今は {k, loc, ver, pct}
const whyText = w => !w ? '' : typeof w === 'string' ? w : (L.why[w.k] ? L.why[w.k](w.loc, w.ver, w.pct) : '');
// サムネイル取得の内訳（旧版は日本語のキー）
const tstat = (ts, k, old) => (ts[k] ?? ts[old]) || 0;
let saveTimer = null;
const savePlan = () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => call('savePlan', { hubId: S.hubId, dest: S.plan.dest, folders: S.plan.folders }).catch(e => console.log(e)), 400);
};
const moveTo = (ids, d) => {
  ids.forEach(id => { const it = S.byId[id]; if (d === it.init) delete S.plan.dest[id]; else S.plan.dest[id] = d; });
  sel.clear(); savePlan(); render();
};

function card(it) {
  const d = dest(it), changed = it.id in S.plan.dest, moving = d !== it.loc, isDel = d === 'DEL';
  const why = whyText(it.why);
  return `<div class="card ${sel.has(it.id) ? 'sel' : ''} ${moving ? 'moved' : ''} ${isDel ? 'del' : ''}" data-id="${esc(it.id)}">
    <div class="thumb"><img loading="lazy" src="${esc(fileUrl(S.workDir + '/thumbs/' + it.thumb))}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'noimg',textContent:L.noimg}))"></div>
    <div class="body">
      <div class="name">${esc(it.name)}</div>
      <div class="meta">${esc(L.meta(it.ver, it.created, it.modified))}${it.size ? ` · ${(it.size / 1024).toFixed(0)}KB` : ''}</div>
      <div class="meta">${L.now}: ${esc(it.loc)}</div>
      <div class="dest">${L.dest}: ${moving ? `<b>${esc(d)}</b>` : L.noMove}</div>
      <div class="row">
        ${isDel ? `<button class="act" data-back="${esc(it.id)}">${L.back}</button>` : `<button class="act del" data-del="${esc(it.id)}">${L.del}</button>`}
        ${changed ? `<button class="act" data-undo="${esc(it.id)}">${L.undoInit}</button>` : ''}
        ${it.dup ? `<span class="tag">${L.sameName}#${it.dup}</span>` : ''}
      </div>
      ${why ? `<div class="why">${esc(why)}</div>` : ''}
    </div></div>`;
}

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  return q ? S.items.filter(it => it.name.toLowerCase().includes(q)) : S.items;
}
function folderSet() {
  const s = new Set();
  const add = k => { if (!k) return; const p = k.split('/'); for (let i = 1; i <= p.length; i++) s.add(p.slice(0, i).join('/')); };
  S.folders.forEach(add); S.plan.folders.forEach(add); S.items.forEach(it => { add(dest(it)); add(it.loc); }); add('DEL');
  // DEL は一番下に
  const isDel = k => k === 'DEL' || k.startsWith('DEL/');
  return [...s].sort((a, b) => (isDel(a) - isDel(b)) || a.localeCompare(b, 'ja'));
}
const under = (list, f, keyOf) => list.filter(it => { const k = keyOf(it); return k === f || k.startsWith(f + '/'); });

function renderNav(keys, countOf, label, droppable) {
  const nav = document.getElementById('nav');
  if (folder === null || !keys.includes(folder)) folder = keys[0] ?? null;
  nav.innerHTML = `<div class="hint">${label}</div>` + keys.map(k => {
    const depth = (k.match(/\//g) || []).length;
    return `<div class="f ${k === folder ? 'on' : ''}" data-f="${esc(k)}" ${droppable ? 'data-drop="1"' : ''} style="padding-left:${8 + depth * 14}px"><span>${esc(k.split('/').pop())}</span><span class="n">${countOf(k)}</span></div>`;
  }).join('') + (droppable ? `<div class="newf"><input type="text" id="newf" placeholder="${esc(L.newFolder)}"><button class="btn small" id="addf">${L.add}</button></div>
    <div class="hint">${esc(L.newFolderHint(folder || ''))}</div>` : '');
}

function render() {
  if (!S) return;
  document.body.classList.toggle('picking', sel.size > 0);
  const moving = S.items.filter(it => dest(it) !== it.loc).length;
  const delN = S.items.filter(it => dest(it) === 'DEL').length;
  document.getElementById('stat').innerHTML = L.stat(S.items.length, moving, delN);
  // 仕分けは画面上の予定だけ。実行するまでハブは変わらないことを、閉じるボタンの近く（右上）で知らせる
  const pend = document.getElementById('pending');
  pend.classList.toggle('on', moving > 0);
  document.querySelector('header').classList.toggle('haspend', moving > 0);
  pend.textContent = L.pending(moving);
  if (moving !== lastPending) { lastPending = moving; call('pending', { n: moving }).catch(() => {}); }
  document.getElementById('tabs').innerHTML = TABS.map(k => `<button class="${k === tab ? 'on' : ''} ${k === 'dl' ? 'dl' : ''}" data-tab="${k}">${k === 'dl' ? DL_ICON : ''}${L.tabs[k]}</button>`).join('');
  const content = document.getElementById('content');
  const list = filtered();
  const selbar = sel.size ? `<div class="selbar">${esc(L.selbar(sel.size))} <button class="act del" id="delsel">${L.delSel}</button> <button class="act" id="clearsel">${L.clearSel}</button></div>` : '';
  const nav = document.getElementById('nav');
  nav.style.display = '';
  if (tab === 'tree') {
    renderNav(folderSet(), k => under(S.items, k, dest).length, L.navTree, true);
    const shown = under(list, folder, dest).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    const ts = S.thumbStats;
    const tOut = ts ? tstat(ts, 'timeout', '時間切れ') : 0, tErr = ts ? tstat(ts, 'error', 'エラー') : 0, tNone = ts ? tstat(ts, 'none', 'サムネなし') : 0;
    const thumbNote = (tOut || tErr)
      ? `<p class="msg err">${esc(L.thumbErr(tOut, tErr))}</p>`
      : (tNone ? `<p class="hint">${esc(L.thumbNone(tNone))}</p>` : '');
    content.innerHTML = thumbNote + `<p class="hint">${esc(L.treeHint(folder || '', shown.length))}</p>${selbar}<div class="grid">${shown.map(card).join('')}</div>`;
  } else if (tab === 'src') {
    const s = new Set(); S.items.forEach(it => { const p = it.loc.split('/'); for (let i = 1; i <= p.length; i++) s.add(p.slice(0, i).join('/')); });
    renderNav([...s].sort((a, b) => a.localeCompare(b, 'ja')), k => under(S.items, k, it => it.loc).length, L.navSrc, false);
    const shown = under(list, folder, it => it.loc).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    content.innerHTML = `<p class="hint">${esc(L.srcHint(shown.length))}</p>${selbar}<div class="grid">${shown.map(card).join('')}</div>`;
  } else if (tab === 'sim') {
    renderNav(folderSet(), k => under(S.items, k, dest).length, L.navDrag, true);
    const section = (key, [title, note]) => {
      const g = {};
      list.forEach(it => { if (it[key]) (g[it[key]] = g[it[key]] || []).push(it); });
      const keys = Object.keys(g).sort((a, b) => a - b);
      return `<h2 style="font-size:14px;margin:14px 0 6px">${title}${L.groups(keys.length)}</h2><p class="hint">${note}</p>` +
        (keys.length ? keys.map(k => `<div class="group"><div class="grid">${g[k].map(card).join('')}</div></div>`).join('') : `<p class="hint">${L.none}</p>`);
    };
    content.innerHTML = selbar + section('simName', L.simName) + section('simLook', L.simLook) + section('simSize', L.simSize);
  } else if (tab === 'dup') {
    renderNav(folderSet(), k => under(S.items, k, dest).length, L.navDrag, true);
    const g = {};
    list.forEach(it => { if (it.dup) (g[it.dup] = g[it.dup] || []).push(it); });
    content.innerHTML = `<p class="hint">${L.dupHint}</p>${selbar}` +
      (Object.keys(g).length ? Object.keys(g).sort((a, b) => a - b).map(k => `<div class="group"><h3>#${k} ${esc(g[k][0].name)}</h3><div class="grid">${g[k].map(card).join('')}</div></div>`).join('') : `<div class="empty">${L.dupNone}</div>`);
  } else if (tab === 'run' || tab === 'dl') {
    // 「実行」＝同じハブ内で移動、「全部ダウンロード」＝パソコンへ保存。別のタブに分けている
    nav.style.display = 'none';
    content.innerHTML = runPanel(tab === 'run' ? 'move' : 'export');
  }
}

// ---------- 実行タブ ----------
let runState = { layout: 'current', outDir: '', preview: null, armed: false, msg: '', msgClass: '' };
function runPanel(mode) {
  const r = runState;
  const pv = r.preview;
  return `
  ${mode === 'move' ? `
  <div class="box"><h2>${L.moveTitle}</h2>

      <span class="spacer"></span><button class="btn" id="undo">${L.undo}</button></div>
    ${pv ? `<p>${L.pvSummary(pv.moves.length, pv.newFolders.length)}</p>

      <table><tr><th>${L.thName}</th><th>${L.thFrom}</th><th>${L.thTo}</th></tr>${pv.moves.slice(0, 500).map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.from)}</td><td>${esc(m.to)}</td></tr>`).join('')}</table>
      ${pv.moves.length > 500 ? `<p class="hint">${L.more(pv.moves.length - 500)}</p>` : ''}` : ''}
  </div>` : `
  <div class="box dl"><h2>${DL_ICON}${L.expTitle}</h2>
    <p class="hint">${L.modeExport}</p>
    <p class="hint">${L.expHint1}</p>
    <p class="hint">${L.expHint2}</p>
    <label><input type="radio" name="layout" value="current" ${r.layout !== 'sorted' ? 'checked' : ''}> ${L.layoutCur}</label>
    <label><input type="radio" name="layout" value="sorted" ${r.layout === 'sorted' ? 'checked' : ''}> ${L.layoutSorted}</label>
    <div class="row"><input type="text" id="out" value="${esc(r.outDir)}" placeholder="${esc(L.outPh)}" style="flex:1;min-width:300px"><button class="btn" id="pick">${L.pick}</button></div>
    <div class="row" style="margin-top:8px"><button class="btn go-dl" id="exp">${L.expStart}</button>${r.outDir ? `<button class="btn" id="openout">${L.openOut}</button>` : ''}</div>
  </div>`}
  ${r.msg && r.msgMode === mode ? `<div class="box"><div class="msg ${r.msgClass}">${esc(r.msg)}</div></div>` : ''}`;
}

async function run(fn) {
  busy(true);
  runState.msgMode = tab === 'dl' ? 'export' : 'move';
  try { await fn(); } catch (e) { runState.msg = L.error + e.message; runState.msgClass = 'err'; }
  busy(false); render();
}

// ---------- イベント ----------
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; }
  const lk = e.target.closest('[data-url]');
  if (lk) {
    const key = lk.dataset.url === 'manual' && LANG !== 'ja' ? 'manualEn' : lk.dataset.url;
    call('openUrl', { url: LINKS[key] }).catch(() => {}); return;
  }
  // 選択中にフォルダをクリックしたら、そこへ移動する（ドラッグの代わり）
  const fd = e.target.closest('[data-drop]');
  if (fd && sel.size) { moveTo([...sel], fd.dataset.f); return; }
  if (e.target.closest('#pending')) { tab = 'run'; folder = null; sel.clear(); render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-tab],[data-f],[data-del],[data-back],[data-undo],#addf,#delsel,#clearsel,#reload,#pv,#arm,#go,#cancel,#undo,#pick,#exp,#openout');
  if (b) {
    if (b.dataset.tab) { tab = b.dataset.tab; folder = null; sel.clear(); render(); window.scrollTo(0, 0); }
    else if (b.dataset.f !== undefined) { folder = b.dataset.f; render(); window.scrollTo(0, 0); }
    else if (b.dataset.del) moveTo([b.dataset.del], 'DEL');
    else if (b.dataset.back) {
      const it = S.byId[b.dataset.back];
      moveTo([it.id], it.init === 'DEL' ? it.loc : it.init);
    }
    else if (b.dataset.undo) { delete S.plan.dest[b.dataset.undo]; savePlan(); render(); }
    else if (b.id === 'addf') {
      const raw = document.getElementById('newf').value.trim();
      const top = raw.startsWith('/');
      const v = raw.replace(/^\/+/, '').replace(/[\\/]+/g, '_');
      if (v) { const f = (folder && !top) ? folder + '/' + v : v; S.plan.folders.push(f); folder = f; savePlan(); render(); }
    }
    else if (b.id === 'delsel') moveTo([...sel], 'DEL');
    else if (b.id === 'clearsel') { sel.clear(); render(); }
    else if (b.id === 'reload') load(true);
    else if (b.id === 'pv') run(async () => { runState.preview = await call('preview', { hubId: S.hubId }); runState.armed = false; runState.msg = ''; });
    else if (b.id === 'arm') { runState.armed = true; render(); }
    else if (b.id === 'cancel') { runState.armed = false; render(); }
    else if (b.id === 'go') run(async () => {
      const r = await call('move', { hubId: S.hubId });
      runState.msg = L.moveResult(r.moved, r.failed) + (r.created && r.created.length ? '\n' + L.created + r.created.join(' / ') : '') + '\n' + L.log + r.log;
      runState.msgClass = r.failed ? 'err' : 'ok'; runState.preview = null; runState.armed = false;
      await load(false);
    });
    else if (b.id === 'undo') run(async () => {
      const r = await call('undo', { hubId: S.hubId });
      runState.msg = L.undoResult(r.back, r.failed); runState.msgClass = r.failed ? 'err' : 'ok';
    });
    else if (b.id === 'pick') run(async () => { const p = await call('pickFolder', {}); if (p) runState.outDir = p; });
    else if (b.id === 'openout') call('openFolder', { path: runState.outDir });
    else if (b.id === 'exp') run(async () => {
      runState.outDir = document.getElementById('out').value.trim();
      const r = await call('export', { hubId: S.hubId, outDir: runState.outDir, layout: runState.layout });
      runState.msg = L.expResult(r);
      runState.msgClass = r.failed ? 'err' : 'ok';
      await load(false);   // サイズによる判定結果を画面に反映
    });
    return;
  }
  const c = e.target.closest('.card');
  if (c) { const id = c.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'out') runState.outDir = e.target.value.trim();
  if (e.target.name === 'layout') runState.layout = e.target.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newf') document.getElementById('addf').click(); });
document.getElementById('q').addEventListener('input', render);
// 言語の切り替え。設定は Python 側に保存し、ダイアログなど Python から出す文言も切り替える
document.getElementById('lang').addEventListener('change', async e => {
  const v = e.target.value;
  const fallback = v === 'auto' ? browserLang() : v;
  try { const r = await call('setLang', { lang: v }); setLang((r && r.lang) || fallback); }
  catch (err) { setLang(fallback); }
});

// ドラッグはマウスイベントで自前実装する（Fusion のパレットでは HTML5 のドラッグ＆ドロップが効かないため）
let drag = null;   // {x, y, ids, active}
const ghost = document.getElementById('ghost');
const folderAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('[data-drop]'); };
document.addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('button,input,select')) return;
  const c = e.target.closest('.card'); if (!c) return;
  const id = c.dataset.id;
  drag = { x: e.clientX, y: e.clientY, ids: sel.has(id) ? [...sel] : [id], active: false };
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    drag.active = true;
    document.body.classList.add('dragging');
    ghost.textContent = L.ghost(drag.ids.length);
    ghost.style.display = 'block';
  }
  ghost.style.left = (e.clientX + 14) + 'px';
  ghost.style.top = (e.clientY + 10) + 'px';
  document.querySelectorAll('.f.over').forEach(x => x.classList.remove('over'));
  const f = folderAt(e.clientX, e.clientY);
  if (f) f.classList.add('over');
});
document.addEventListener('mouseup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  ghost.style.display = 'none';
  document.body.classList.remove('dragging');
  document.querySelectorAll('.f.over').forEach(x => x.classList.remove('over'));
  if (!d.active) return;   // 動かしていなければ通常のクリック（選択）として扱う
  suppressClick = true;
  const f = folderAt(e.clientX, e.clientY);
  if (f) moveTo(d.ids, f.dataset.f);
});
let suppressClick = false;

// ---------- 起動 ----------
// reload=false: 前回取得した一覧を開くだけ（無ければ取得を促す）／ reload=true: ハブから取得し直す
async function load(reload) {
  const hubId = document.getElementById('hub').value;
  const content = document.getElementById('content');
  busy(true);
  if (reload) content.innerHTML = `<div class="empty">${L.scanning}</div>`;
  try {
    const r = await call('scan', { hubId, reload, cacheOnly: !reload });
    if (!r) {
      S = null;
      document.getElementById('stat').innerHTML = '';
      document.getElementById('tabs').innerHTML = '';
      document.getElementById('nav').style.display = 'none';
      document.getElementById('scanned').textContent = L.notScanned;
      content.innerHTML = `<div class="empty">${L.notScannedBody}</div>`;
    } else {
      r.byId = Object.fromEntries(r.items.map(it => [it.id, it]));
      r.plan.dest = r.plan.dest || {}; r.plan.folders = r.plan.folders || [];
      S = r; folder = null; sel.clear();
      document.getElementById('scanned').textContent = L.scannedAt + (r.scanned || '').replace('T', ' ').slice(0, 16);
    }
  } catch (e) {
    content.innerHTML = `<div class="box"><div class="msg err">${esc(L.failed + e.message)}</div></div>`;
  }
  busy(false); render();
}
document.getElementById('hub').addEventListener('change', () => load(false));
async function start() {
  setLang(LANG);
  for (let i = 0; i < 100 && !(window.adsk && adsk.fusionSendData); i++) await new Promise(r => setTimeout(r, 100));
  try {
    const r = await call('init', {});
    if (r.lang) setLang(r.lang);
    document.getElementById('lang').value = r.langSetting || 'auto';
    document.getElementById('hub').innerHTML = r.hubs.map(h => `<option value="${esc(h.id)}" ${h.id === r.activeHubId ? 'selected' : ''}>${esc(h.name)}</option>`).join('');
    await load(false);   // 前回の一覧があればすぐ開く
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="box"><div class="msg err">${esc(e.message)}</div></div>`;
  }
}
start();
</script>
